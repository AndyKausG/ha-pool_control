[project]
name = "ha-pool-control"
version = "1.0.0b1"
description = "Home Assistant integration for pool filtration, chlorination and pH dosing"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.316",
    "freezegun",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PL", "C4", "PT", "TID"]
ignore = [
    "D203",
    "D213",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.pool_control"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.pool_control --cov-report=term-missing"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
