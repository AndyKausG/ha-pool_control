blueprint:
  name: Pool Control - notify about problems and maintenance
  description: >
    Runs the given actions when Pool Control reports a problem or a due
    maintenance task. The code (for example ph_tank_low or backwash) is
    available as {{ problem }}, the event type (problem or maintenance_due)
    as {{ type }}.
  domain: automation
  source_url: https://github.com/AndyKausG/ha-pool_control/blob/main/blueprints/automation/pool_control/notify_problems.yaml
  input:
    pool:
      name: Pool
      selector:
        config_entry:
          integration: pool_control
    actions:
      name: Actions
      description: For example a notification to your phone.
      selector:
        action: {}

triggers:
  - trigger: event
    event_type: pool_control_event
    event_data:
      type: problem
  - trigger: event
    event_type: pool_control_event
    event_data:
      type: maintenance_due

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.entry_id == entry_id }}"

variables:
  entry_id: !input pool
  type: "{{ trigger.event.data.type }}"
  problem: "{{ trigger.event.data.problem | default(trigger.event.data.task) }}"

actions: !input actions

mode: queued
